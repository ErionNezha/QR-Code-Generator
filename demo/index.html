<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
<title>MR.ERIONXX | QR Generator</title>
  <link rel="shortcut icon" href="img/terminal.png" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrapper">
    <header>
      <h1><span class="glow">QR Code Generator</span></h1>
      <p>Transform any text or link into a scannable QR code instantly.</p>
    </header>

    <div class="form">
      <input type="text" spellcheck="false" placeholder="Enter text or URL here...">
      <button>Generate QR Code</button>
    </div>

    <div class="qr-code">
      <img src="" alt="QR code">
      <a class="download-btn" download="qr-code.png">Download QR Code</a>
    </div>

    <footer>
      Krijuar nga <a href="https://erionnezha.netlify.app" target="_blank"><strong>Erion Nezha</strong></a> — © 2026
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
